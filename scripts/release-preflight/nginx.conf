server {
    listen 80;
    server_name localhost;

    location = /pantry-nook {
        return 302 /pantry-nook/;
    }

    location ^~ /pantry-nook/api/ {
        auth_basic "Pantry Nook preflight";
        auth_basic_user_file /etc/nginx/pantry-nook.htpasswd;
        rewrite ^/pantry-nook/api/(.*)$ /api/$1 break;
        proxy_pass http://host.docker.internal:18014;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /pantry-nook/assets/ {
        auth_basic "Pantry Nook preflight";
        auth_basic_user_file /etc/nginx/pantry-nook.htpasswd;
        alias /usr/share/nginx/html/pantry-nook/assets/;
        try_files $uri $uri/ =404;
    }

    location ^~ /pantry-nook/ {
        auth_basic "Pantry Nook preflight";
        auth_basic_user_file /etc/nginx/pantry-nook.htpasswd;
        alias /usr/share/nginx/html/pantry-nook/;
        index index.html;
        try_files $uri $uri/ /pantry-nook/index.html;
    }
}
